# Preserve the flat dependency layout used by the existing Expo/native builds.
nodeLinker: hoisted
# Keep local and CI dependency checks consistent with the hoisted layout.
enableGlobalVirtualStore: false

# Explicit install-script decisions keep local and CI installs non-interactive.
allowBuilds:
  esbuild: true
  unrs-resolver: true
  fsevents: false

# Exact versions already present in the imported npm lockfile.
minimumReleaseAgeExclude:
  - '@formatjs/intl-getcanonicallocales@3.3.0'
  - '@formatjs/intl-listformat@8.4.0'
  - '@formatjs/intl-locale@5.4.1'
  - '@formatjs/intl-localematcher@0.10.0'
  - '@formatjs/intl-pluralrules@6.4.0'
  - '@formatjs/intl-relativetimeformat@12.4.0'
  - '@formatjs/intl-supportedvaluesof@2.5.0'
  - '@expo/cli@58.1.18'
  - '@expo/config@58.0.10'
  - '@expo/fingerprint@0.21.8'
  - '@expo/local-build-cache-provider@58.0.10'
  - '@expo/log-box@58.0.14'
  - '@expo/metro-config@58.0.20'
  - '@expo/metro-runtime@58.0.16'
  - '@expo/prebuild-config@58.0.18'
  - '@expo/router-server@58.0.20'
  - '@expo/schema-utils@58.0.3'
  - babel-preset-expo@58.0.23
  - expo-modules-core@58.0.29
  - expo@58.0.22
  - '@expo/ui@58.0.26'
  - expo-audio@58.0.11
  - expo-background-task@58.0.12
  - expo-dev-client@58.0.18
  - expo-dev-launcher@58.0.18
  - expo-router@58.0.29
  - expo-sqlite@58.0.15
  - expo-task-manager@58.0.13
  - expo-updates@58.0.20
  - expo-widgets@58.0.26
